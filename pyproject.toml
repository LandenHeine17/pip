[project]
name = "pip-assistant"
version = "0.1.0"
description = "Pip: a playful household voice assistant for the Raspberry Pi"
requires-python = ">=3.11"
license = { text = "Not yet chosen (D-70: MIT recommended before publishing)" }
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "openwakeword==0.6.0",
  "piper-tts>=1.7",
  "httpx>=0.27",
  "faster-whisper>=1.1",
  "sherpa-onnx>=1.12",
  "sherpa-onnx-core>=1.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pip-core = "pip_assistant.core.main:run"
pip-ears = "pip_assistant.ears.main:run"
pip-thinker = "pip_assistant.thinker.main:run"
pip-web = "pip_assistant.web.main:run"
pip-builder = "pip_assistant.builder.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pip_assistant*"]

[tool.setuptools.package-data]
pip_assistant = ["defaults.toml", "web/static/*", "modules/*/module.toml", "modules/*/static/*"]

[tool.uv]
# Only use releases at least two weeks old (supply-chain caution).
exclude-newer = "2026-10-20T00:00:00Z"
# openWakeWord lists TensorFlow Lite for Linux, but Pip only uses its ONNX models,
# and there is no TF Lite build for this Pi's Python. Skip it.
override-dependencies = ["tflite-runtime; sys_platform == 'never'"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "pip_assistant/modules"]
pythonpath = ["tests"]   # test helpers (modhelp.py, fakes/) for the module tests too
markers = ["real_turn_waits: use Pip's real end-of-turn waits (D-106) instead of the shortened test ones"]
