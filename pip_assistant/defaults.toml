# Pip's default settings. Your own settings go in ~/pip-data/settings.toml and override these.
# Every setting has a short explanation. A setting you don't mention keeps its default.

[pip]
name = "Pip"                       # What Pip calls himself.

[programs]
expected = ["ears", "thinker", "web", "builder"]   # Programs pip-core expects to hear from.
heartbeat_seconds = 2.0                 # How often each program says "I'm alive".
stuck_after_seconds = 10.0              # No heartbeat for this long means a program is stuck.
restart_stuck = true                    # Restart a stuck program automatically (only when run as a service).

[trace]
keep_hours = 48                    # How long the decision trace (what happened, never the words) is kept.

[ears]
barge_in = true                         # Stop talking straight away when someone talks over Pip.
barge_in_dbfs = -45.0                   # How loud speech over Pip must be to count (−96 silent … 0 max).
barge_in_voice_check = true             # …and it must have a voice in it: a knock or a clap doesn't cut him off (D-122).
duck_before_stop = true                # …and a voice first only lowers his voice: he stops if they keep talking, comes back up if not (D-128).
voice_engine = "piper"                  # Voice engine (swappable, PIP-NEW-097).
voice = "en_US-lessac-medium"           # Voice model in ~/pip-data/models/voices (D-73).
speech_rate = 1.05                      # 1.05 as Ziggletron (D-137); 1.0 = normal; 1.2 = a bit faster; 0.8 = slower.

[listen]
speech_dbfs = -50.0                # Louder than this counts as speech when cutting out what you said.
end_silence_seconds = 0.7          # A pause this long means you've finished speaking (Ziggletron: 0.7).
max_utterance_seconds = 12.0       # Longest single request.
wait_for_speech_seconds = 4.0      # In the follow-up window, how long to wait for you to start talking.

[phone]
# Talking to Pip on a phone (D-149): the /phone page (https://<pi>.<tailnet>.ts.net:8791/phone) can take over
# Pip's microphone and speaker. While it has him, the room isn't listened to and he speaks only on the phone.
enabled = true                     # Allow a phone (or any browser) to take over Pip's microphone and speaker.
idle_minutes = 10                  # Give Pip back to the room after this long with nobody talking through the phone.
no_audio_seconds = 4.0             # …or as soon as the phone stops sending sound this long (locked, page closed).
speech_dbfs = -50.0                # Louder than this counts as speech through the phone (like [listen] speech_dbfs).
barge_in_dbfs = -45.0              # How loud speech over Pip must be to count, through the phone (like [ears]).

[voices]
# Recognising who's speaking (step 5, D-87). Voiceprints stay on the Pi and are never sent to Claude.
model = "nemo_en_titanet_small"    # In ~/pip-data/models/speaker (downloaded by deploy/install.sh).
sure = 0.45                        # Match this close (and clearly ahead of anyone else) = "sure": personal things, private memories.
probably = 0.33                    # This close = "probably": low-stakes personalising only. Below = "Someone".
margin = 0.05                      # "Sure" also needs to beat the next-closest person by this much.
min_seconds = 0.8                  # Shorter speech is too little to recognise a voice.

[stt]
provider = "groq"                  # Speech-to-text service (swappable, PIP-NEW-008; D-48).
model = "whisper-large-v3-turbo"
spare_models = ["whisper-large-v3"]   # Used when the model above has hit Groq's daily limit (2,000 a day each on the free plan, D-115).
timeout_seconds = 6.0
voice_check = true                 # Only send sounds with a human voice in them to speech-to-text (D-85: stops phantom "Thank you.").
min_voice_seconds = 0.15           # Less voice than this is treated as noise.
drop_phantoms = true              # "Thank you.", "you", "Bye." alone, from a voice Pip doesn't know, are noise (2026-11-12).
offline_model = "base.en"          # Whisper model on the Pi, used only when Groq can't be reached ("" = none). D-83
# Words that help speech-to-text spell names and terms right (from the M0 benchmark).
word_list = "Pip, Hey Pip, Pippletron, Pippy, Pips, Ziggletron. Raspberry Pi, ESP32, ESPHome, MQTT, Tailscale, Groq, Claude, Eightree plug, desk lamp, Lincoln, Nebraska."

[social]
# Pip listens to the room like Ziggletron and decides for himself when to join in (D-92).
join_in = true                     # Off: he only answers when called or his name comes up.
mood = "chatty"                    # How often he considers joining in: quiet (2 min), normal (40 s), chatty (15 s).
                                   # Saying "Pip, set chattiness to low / normal / high" overrides this (D-136).
pause_seconds = 1.2                # The room must pause this long first.
live_conversation_seconds = 60.0   # Only if someone spoke within this long.
quiet_hours = "23:00-07:00"        # Never joins in (or says welcome back) at these times (D-66).
welcome_back_minutes = 20          # "Hey Landen, welcome back" after the room was quiet this long (0 = never).
step_back_minutes = 15            # Told "not now" or talked over just after joining in: he stays out this long (D-124).

[mic]
# Switching listening off (D-91): the dashboard's Listening switch, or two claps. Both must be on.
# Claps are heard on a separate plain USB microphone (the speakerphone's noise filter erases them), chosen on the
# dashboard (Listening & sounds). Tuned on the owner's Session F recordings from that mic (2026-11-08).
clap_peak_dbfs = -12.0             # How loud a clap must be (its loudest 10 ms).
clap_jump_db = 25.0                # How far above the room's sound just before it.
clap_max_ms = 250                  # A clap is over within this; anything longer (a door, talking) isn't one.
clap_gap_min_ms = 150              # The two claps come at least this far apart…
clap_gap_max_ms = 1500             # …and at most this far,
clap_settle_ms = 700               # …and then nothing more for this long (three claps or applause don't count).
# Switching OFF is stricter (2026-11-17: false switch-offs came mostly while people talked). Switching on isn't.
clap_off_quiet_seconds = 1.5       # Nobody talking for this long before the first clap…
clap_off_max_ms = 200              # …each clap at most this long…
clap_off_gap_max_ms = 800          # …and at most this far apart.

[conversation]
own_commands = "sure"              # Pip's fixed-phrasing commands: "sure" = clearly worded ones (stop, snooze, a timer for a
                                   # length, what time is it) at once, everything else to Claude (D-123); "offline" = only
                                   # without internet (D-94); "always" = try them first, as before step 6.
follow_up_seconds = 8.0            # After Pip speaks, anyone can talk again within this time without saying his name (D-136).
carry_on_after_backchannel = true  # Talked over by only "yeah", a laugh or nothing: he carries on from where he was cut off (D-122).
wait_after_name_seconds = 5.0      # Said only his name, with nothing said just before? Pip listens quietly this long for the rest.
name_lookback_seconds = 30.0       # Said only his name ("what's the weather… Pip?"): what was said this long before counts (D-134).
name_alone_wait_seconds = 2.5      # …but first he waits this long after his name (from when you stopped) in case the question comes next.
# Knowing when you're done talking (D-106, D-122, D-137, D-138). Each wait is counted from when you stop talking: the
# 0.7 s pause ([listen]) and speech-to-text count towards it, so at 0.7 he answers as soon as the words are in, like
# Ziggletron. If you start talking again before he's said anything, the answer is dropped and it's all taken as one.
turn_wait_seconds = 0.7            # Seconds from when you stop talking before he answers.
unfinished_wait_seconds = 3.0      # …after a half-finished sentence ("what's the...", "remind me to").
turn_wait_after_interrupt_seconds = 0.5   # Added to the next turn after someone talked over him: he takes the hint.

[alarms]
# Timers, alarms, reminders and calendar heads-ups (FEAT-033–041).
ring_minutes = 5.0                 # Keep ringing this long if nobody answers, then stop and note it on the dashboard.
announce_every_seconds = 30.0      # Say what it is again this often while ringing ("Your pasta timer is done.").
snooze_minutes = 5.0               # "Snooze" with no length given.
missed_grace_minutes = 30.0        # Pip was off when it was due? Still ring if it's no later than this; else mark it missed.
# Ringtone for each kind: classic, kitchen, chimes or gentle.
ringtones = { timer = "kitchen", alarm = "classic", reminder = "chimes", event = "chimes" }

[thinker]
thinking_tone = "always"           # Soft tone when Pip starts thinking (D-86): "always", "slow" (only if the answer is slow) or "off". Not for a reply without his name (D-145).
thinking_tone_after_seconds = 1.5  # For "slow": play it if the answer hasn't started after this long.
model = "opus"                     # Claude model. Opus, like Ziggletron: the most personality, and a short reply is out in ~1.6 s (Haiku 1.3 s), D-137.
effort = "low"                     # How hard Claude thinks: low is quickest (like Ziggletron).
timeout_seconds = 45.0             # Give up on an answer after this long.
web_search = false                 # Claude's own built-in web search (slow: 10-15 s). Off since D-125: the websearch
                                   # module looks things up instead (~5 s). On: the old way, e.g. without a Brave key.
location = "Lincoln, Nebraska"     # Where Pip lives (D-63).

[face]
# How Pip's face looks on the monitor (D-128). Changed on the Settings page, with a preview.
eye_style = "rounded"              # rounded (squircle), round, square or tall.
colors = "states"                  # states (a colour for each state, like the dashboard's circle), blue, mint, warm or white.
expressions = true                 # Brief reactions: pleased when thanked, confused when he didn't catch it, amused at a joke, surprised when talked over, sleepy in quiet hours.
status_icons = true                # Small icons in the corner: listening off, no internet, quiet hours, a usage limit reached.

[web]
host = "127.0.0.1"                 # Address the dashboard listens on. On the Pi this is the Tailscale address.
port = 8790                        # Port for the dashboard.
tv_host = "127.0.0.1"              # Also listen here (same port), so the monitor's browser on the Pi works without Tailscale.
allowed_hosts = []                 # Other names the dashboard may be opened by (its own address and Tailscale name always work).
https_port = 8791                  # Tailscale's https for the dashboard (deploy/install-https.sh; 443 is left to anything else, D-149).

[builder]
# Pip changing his own code (D-152): he writes the request up, Claude Hub opens a chat for it in plan mode, and you
# do the rest there. The Changes page shows where each one is.
enabled = true                     # Allow self-changes at all.
hub_inbox = "~/.local/state/claude-hub/inbox"   # Where Claude Hub looks for new chats (~/claude-hub/hub/inbox.py).
hub_url = ""                       # Claude Hub's address for the Changes page's links ("" = this Pi, ports 8443/8795).
model = "opus"                     # Claude model for the chat.
keep_days = 90                     # The words of a request are deleted after this many days (the change's record stays).
