# Pip's default settings. Your own settings go in ~/pip-data/settings.toml and override these.
# Every setting has a short explanation. A setting you don't mention keeps its default.

[pip]
name = "Pip"                       # What Pip calls himself.

[programs]
expected = ["ears", "thinker", "web"]   # Programs pip-core expects to hear from.
heartbeat_seconds = 2.0                 # How often each program says "I'm alive".
stuck_after_seconds = 10.0              # No heartbeat for this long means a program is stuck.
restart_stuck = true                    # Restart a stuck program automatically (only when run as a service).

[trace]
keep_hours = 48                    # How long the decision trace (what happened, never the words) is kept.

[ears]
wake_words = ["pippletron", "hey_pip"]  # Wake-word models to listen for (D-74).
# How sure each detector must be (0–1): higher = fewer false wakes, more misses.
# Pippletron is strict because "Ziggletron" sounds similar (M1a step 2 finding).
wake_thresholds = { pippletron = 0.8, hey_pip = 0.5 }
barge_in = true                         # Stop talking straight away when someone talks over Pip.
barge_in_dbfs = -45.0                   # How loud speech over Pip must be to count (−96 silent … 0 max).
voice_engine = "piper"                  # Voice engine (swappable, PIP-NEW-097).
voice = "en_US-lessac-medium"           # Voice model in ~/pip-data/models/voices (D-73).
speech_rate = 1.0                       # 1.0 = normal; 1.2 = a bit faster; 0.8 = slower.

[listen]
speech_dbfs = -50.0                # Louder than this counts as speech when cutting out what you said.
end_silence_seconds = 0.7          # A pause this long means you've finished speaking (Ziggletron: 0.7).
max_utterance_seconds = 12.0       # Longest single request.
wait_for_speech_seconds = 4.0      # In the follow-up window, how long to wait for you to start talking.
after_wake_seconds = 0.7           # After the wake word, how long to wait for a question (else it came before the name).
transcript_wake = true             # Transcribe everything said in the room, like Ziggletron (D-92). Off: only the wake word.

[voices]
# Recognising who's speaking (step 5, D-87). Voiceprints stay on the Pi and are never sent to Claude.
model = "nemo_en_titanet_small"    # In ~/pip-data/models/speaker (downloaded by deploy/install.sh).
sure = 0.45                        # Match this close (and clearly ahead of anyone else) = "sure": personal things, private memories.
probably = 0.33                    # This close = "probably": low-stakes personalising only. Below = "Someone".
margin = 0.05                      # "Sure" also needs to beat the next-closest person by this much.
min_seconds = 0.8                  # Shorter speech is too little to recognise a voice.

[stt]
provider = "groq"                  # Speech-to-text service (swappable, PIP-NEW-008; D-48).
model = "whisper-large-v3-turbo"
timeout_seconds = 6.0
voice_check = true                 # Only send sounds with a human voice in them to speech-to-text (D-85: stops phantom "Thank you.").
min_voice_seconds = 0.15           # Less voice than this (except right after the wake word) is treated as noise.
offline_model = "base.en"          # Whisper model on the Pi, used only when Groq can't be reached ("" = none). D-83
# Words that help speech-to-text spell names and terms right (from the M0 benchmark).
word_list = "Pip, Hey Pip, Pippletron, Pippy, Pips, Ziggletron. Raspberry Pi, ESP32, ESPHome, MQTT, Tailscale, Groq, Claude, Eightree plug, desk lamp, Lincoln, Nebraska."

[social]
# Pip listens to the room like Ziggletron and decides for himself when to join in (D-92).
join_in = true                     # Off: he only answers when called or his name comes up.
mood = "normal"                    # How often he considers joining in: quiet (2 min), normal (40 s), chatty (15 s).
pause_seconds = 1.2                # The room must pause this long first.
live_conversation_seconds = 60.0   # Only if someone spoke within this long.
quiet_hours = "23:00-07:00"        # Never joins in (or says welcome back) at these times (D-66).
welcome_back_minutes = 20          # "Hey Landen, welcome back" after the room was quiet this long (0 = never).

[mic]
# Switching listening off (D-91): the dashboard's Listening switch, or two claps. Both must be on.
claps = true                       # Two claps switch listening off and on.
clap_peak_dbfs = -20.0             # A clap must be at least this loud at its peak…
clap_rise_db = 20.0                # …jump this far above the room's background…
clap_drop_db = 15.0                # …and fall this far again…
clap_decay_ms = 150                # …within this long.
clap_attack_ms = 10                # Loudest at most this long after it starts (speech builds up slower).
clap_width_ms = 80                 # Near its loudest for at most this long.
clap_gap_min_ms = 150              # The two claps come this far apart…
clap_gap_max_ms = 800              # …at most.
clap_quiet_after_ms = 600          # Then this long with no third clap and no talking.
clap_quiet_before_ms = 300         # And the room must have been quiet just before the first.
clap_talk_dbfs = -45.0             # Louder than this counts as talking, not quiet.

[conversation]
own_commands = "offline"           # Pip's fixed-phrasing commands: "offline" = only without internet (D-94; online, Claude
                                   # understands any wording); "always" = try them first, as before step 6.
follow_up_seconds = 8.0            # After Pip answers, talk again within this time without saying his name.
wait_after_name_seconds = 5.0      # Said only his name? Pip listens quietly this long for the rest (no "Yes?" talking over you).
unfinished_wait_seconds = 2.0      # Stopped mid-sentence ("what's the...")? Pip waits this long for the rest before answering.
max_sentences = 2                  # Pip stops after this many sentences unless you asked for detail or a story (D-79).

[alarms]
# Timers, alarms, reminders and calendar heads-ups (FEAT-033–041).
ring_minutes = 5.0                 # Keep ringing this long if nobody answers, then stop and note it on the dashboard.
announce_every_seconds = 30.0      # Say what it is again this often while ringing ("Your pasta timer is done.").
snooze_minutes = 5.0               # "Snooze" with no length given.
missed_grace_minutes = 30.0        # Pip was off when it was due? Still ring if it's no later than this; else mark it missed.
# Ringtone for each kind: classic, kitchen, chimes or gentle.
ringtones = { timer = "kitchen", alarm = "classic", reminder = "chimes", event = "chimes" }

[thinker]
thinking_tone = "always"           # Soft tone when Pip starts thinking (D-86): "always", "slow" (only if the answer is slow) or "off".
thinking_tone_after_seconds = 1.5  # For "slow": play it if the answer hasn't started after this long.
model = "sonnet"                   # Claude model: "sonnet" starts answering in ~0.9 s vs ~2.3 s for the default Opus.
effort = "low"                     # How hard Claude thinks: low is quickest (like Ziggletron).
timeout_seconds = 45.0             # Give up on an answer after this long.
web_search = true                  # Let Claude look things up for current facts.
location = "Lincoln, Nebraska"     # Where Pip lives (D-63).

[web]
host = "127.0.0.1"                 # Address the dashboard listens on. On the Pi this is the Tailscale address.
port = 8790                        # Port for the dashboard.
