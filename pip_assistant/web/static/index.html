<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip · Overview</title>
<link rel="stylesheet" href="/pip.css">
<style>
.overview{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.overview>div{display:flex;flex-direction:column;gap:18px;min-width:0}
.overview section{margin:0}
@media (max-width:860px){.overview{grid-template-columns:minmax(0,1fr)}}
#feed{display:flex;flex-direction:column;gap:8px}
.notice{padding:10px 14px;border-radius:14px;background:var(--warnbg);color:var(--warn);font-weight:600;font-size:.88rem}
.check{width:auto;accent-color:var(--accent);transform:scale(1.15)}
</style>
</head>
<body>
<!-- The Overview (D-148): just the basics, each card leading to its page. What needs you, timers and alarms, the chat
     box with the last few lines, and the cards modules add (core/modules.py home(): the calendar's next two weeks,
     the to-dos, the routines). The menu and the status bar around it are drawn by pip.js. -->
<main>
<div class="pagehead"><h1>Overview</h1><span class="sub" id="today"></span></div>
<div class="overview">
<div>
<section id="needs" hidden>
  <div class="head"><h2>Needs you</h2></div>
  <div class="items" id="needlist"></div>
</section>

<section>
  <div class="head"><h2>Timers &amp; alarms</h2><span class="sub">saved instantly · survive restarts</span></div>
  <div class="items" id="alerts"></div>
  <form id="newtimer"><input id="tmin" type="number" min="0.1" step="0.1" placeholder="Minutes" style="width:7em" required>
    <input id="tlabel" placeholder="Label (optional)" maxlength="40" style="flex:1;min-width:8em"><button class="primary">Start timer</button></form>
</section>

<section>
  <div class="head"><h2>Talk to Pip</h2><a href="/talk">Everything heard ›</a></div>
  <div id="chat"></div>
  <div id="feed"></div>
</section>
</div>

<div id="cards"></div>
</div>
</main>
<script src="/pip.js"></script>
<script src="/talk.js"></script>
<script>
$("today").textContent = new Date().toLocaleDateString([], {weekday: "long", month: "long", day: "numeric"});

// ---------------------------------------------------------------- needs you: things only the owner can settle
// Memories waiting for approval or flagged, changes waiting, a program that's stuck, Claude's usage pause, someone
// whose voice isn't learned. Each links to the page where it's settled. Hidden when there's nothing.
async function loadNeeds(){
  const [mem, ch, h, ppl] = await Promise.all(["/api/memory", "/api/changes", "/api/health", "/api/people"].map(u => getJSON(u).catch(() => ({}))));
  const out = [], need = (icon, text, href) => out.push(`<a class="need" href="${href}"><span>${icon}</span><span>${esc(text)}</span><span class="go">›</span></a>`);
  const mems = mem.memories || [];
  const pend = mems.filter(m => m.status === "pending").length, flagged = mems.filter(m => m.status === "active" && m.review).length;
  if (pend) need("🧠", `${pend} ${pend === 1 ? "memory waits" : "memories wait"} for your OK`, "/memory");
  if (flagged) need("🧠", `${flagged} ${flagged === 1 ? "memory" : "memories"} to check (may contradict another, or belong elsewhere)`, "/memory?review=1");
  const waiting = (ch.changes || []).filter(c => c.waiting).length;
  if (waiting) need("🛠️", `${waiting} ${waiting === 1 ? "change to Pip waits" : "changes to Pip wait"} for you`, "/changes");
  const progs = h.programs || {}, bad = Object.keys(progs).filter(n => progs[n].state !== "ok");
  if (bad.length) need("🩺", `${bad.map(n => "pip-" + n).join(", ")} ${bad.length === 1 ? "isn't" : "aren't"} running right`, "/system");
  const until = (progs.thinker || {}).paused_until;
  if (until && until * 1000 > Date.now()) need("✳️", `Claude's usage limit reached: joining in and self-changes paused until ${new Date(until * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})}`, "/system");
  if (ppl.voice_model) for (const p of ppl.people || []) if (!p.voice_samples) need("🎙️", `${p.name}'s voice isn't learned yet`, `/person?id=${encodeURIComponent(p.id)}`);
  $("needlist").innerHTML = out.join("");
  $("needs").hidden = !out.length;
}

// ---------------------------------------------------------------- timers, alarms and the modules' cards
let sched = {alerts: [], cards: [], missed: [], now: 0}, skew = 0;
const KIND = {timer: "Timer", alarm: "Alarm", reminder: "Reminder", event: "Heads-up"};
const REP = r => !r ? "" : r.startsWith("weekly:") ? "every " + ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][+r.slice(7)] : {daily: "every day", weekdays: "weekdays", weekends: "weekends", weekly: "every week"}[r] || r;
function clock(ts){ return new Date(ts * 1000).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"}); }
function left(s){ s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; }
function renderSched(){
  const now = Date.now() / 1000 - skew;
  const missed = (sched.missed || []).map(a => `<div class="item"><div><span class="tag">Missed</span><b>${esc(a.label)}</b><div class="sub">${clock(a.due)} · Pip was off</div></div></div>`);
  $("alerts").innerHTML = sched.alerts.map(a => {
    const name = a.label && !["timer", "alarm"].includes(a.label) ? esc(a.label) : "";
    const pct = a.kind === "timer" && a.length ? Math.max(0, Math.min(100, 100 * (a.due - now) / a.length)) : null;
    return `<div class="item"><div><span class="tag">${esc(KIND[a.kind] || a.kind)}</span><b>${name}</b>
      <div class="sub">${a.kind === "timer" ? "of " + left(a.length || 0) : clock(a.due)}${a.repeat ? " · " + REP(a.repeat) : ""}${a.state === "ringing" ? " · ringing" : ""}</div>
      ${pct != null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}</div>
      <span style="display:flex;align-items:center;gap:6px">${a.kind === "timer" ? `<span class="big">${left(a.due - now)}</span>` : ""}<button class="ghost" title="Cancel" onclick="act({action:'cancel',id:${js(a.id)}})">✕</button></span></div>`;
  }).concat(missed).concat(sched.later_heads_ups ? [`<div class="sub" style="padding:4px 2px">+ ${sched.later_heads_ups} more heads-up${sched.later_heads_ups > 1 ? "s" : ""} after tomorrow</div>`] : []).join("")
    || `<div class="empty">Nothing set. Say "Pip, set a timer for 10 minutes".</div>`;
}
// Each card a module adds (its home(), core/modules.py): a list of dated items, each with ✕ if it can remove them,
// or (a card with "check") things to tick off, like the to-dos, each with a box that sends that action.
function itemHTML(c, e){
  if (c.check) return `<label class="item" style="justify-content:flex-start;cursor:pointer"><input type="checkbox" class="check" onchange="checkItem(this,${js(c.module)},${js(c.check)},${js(e.id)})">
    <div><b>${esc(e.title)}</b>${e.sub ? `<div class="sub">${esc(e.sub)}</div>` : ""}</div></label>`;
  return `<div class="item" style="border-left:4px solid ${esc(e.color || "transparent")}"><div><b>${esc(e.title)}</b>${e.private ? ` <span class="pill" style="background:var(--line)">private</span>` : ""}<div class="sub">${e.all_day ? new Date(e.at * 1000).toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"}) + " · all day" : clock(e.at)}${e.repeat ? " · " + REP(e.repeat) : ""}</div></div>
    ${c.remove ? `<button class="ghost" title="Remove" onclick="removeItem(${js(c.module)},${js(c.remove)},${js(e.id)},${e.repeat ? 1 : 0})">✕</button>` : ""}</div>`;
}
function renderCards(){
  $("cards").innerHTML = (sched.cards || []).map(c => `<section><div class="head"><h2>${esc(c.title)}</h2>${c.link ? `<a href="${esc(c.link)}">Open ›</a>` : ""}</div>
    <div class="items">${(c.items || []).map(e => itemHTML(c, e)).join("") || `<div class="empty">${esc(c.empty || "Nothing here.")}</div>`}</div></section>`).join("");
}
async function removeItem(module, action, id, repeats){
  if (!confirm(repeats ? "Remove this (all repeats)?" : "Remove this?")) return;
  try { await pip.act(pip.post(action, {id}, module)); } finally { loadSched(); }
}
async function checkItem(box, module, action, id){
  box.disabled = true;
  try { await pip.act(pip.post(action, {id}, module)); } finally { loadSched(); }
}
async function loadSched(){
  try { const r = await getJSON("/api/alerts"); if (r.now) { sched = r; skew = Date.now() / 1000 - r.now; renderSched(); renderCards(); } } catch (e) {}
}
async function act(body){
  try { const r = await postJSON("/api/alerts/action", body); if (r.error) alert(r.error); return r; }
  catch (e) { alert("Couldn't reach Pip"); } finally { loadSched(); }
}
$("newtimer").onsubmit = async ev => { ev.preventDefault(); const r = await act({action: "timer", minutes: +$("tmin").value, label: $("tlabel").value});
  if (r && r.ok) { $("tmin").value = ""; $("tlabel").value = ""; } };
setInterval(renderSched, 1000); setInterval(loadSched, 30000);
pip.on("alerts", loadSched);
// a module with a card here says it changed (a to-do ticked off by voice): fetch the cards again
pip.on("module", d => { if ((sched.cards || []).some(c => c.module === d.module)) loadSched(); });
pip.on("people", loadNeeds);
setInterval(loadNeeds, 30000);

Talk.mount({feed: $("feed"), chat: $("chat"), limit: 4, speechOnly: true,
            empty: "Say \"Pip\" and ask something, or type to him above.", onPip: () => { loadNeeds(); loadSched(); }});
loadSched(); loadNeeds();
</script>
</body>
</html>
