<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pip</title>
<!-- Pip's face on the monitor (step 7, D-110, D-111). The face and its drawing, and the way boxes are laid
     out and animated, come from Ziggletron's tv.html; the states, colours and kinds of box are Pip's.
     It only watches: no buttons, nothing sent. It gets only what it shows (/api/tv, /api/tv/stream,
     /api/tv/vitals): Pip's state, the mouth level, the screen's layout, and the data of the boxes on it.
     Captions under the face are only lines said to Pip and his replies; room talk comes only while a
     Conversation box that shows it is on the screen (D-111). -->
<style>
    :root {
    --bg: #09090c; --ink: #f1eee8; --muted: #aaa59d; --line: #2a2a31; --track: #24242b;
    --good: #5fe0b0; --warning: #ffc857; --critical: #ff7a6e;
    --state: #5fe0b0;
    /* Everything is sized from the screen, so 1080p and 4K look the same: 1rem = 1/54 of the height. */
    font-size: min(calc(100vh / 54), calc(100vw / 96));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); cursor: none; }
  body { color: var(--ink); font-family: system-ui, "DejaVu Sans", sans-serif; font-size: 1.6rem; line-height: 1.3; }

  /* The whole screen creeps around a little, so nothing stays still long enough to burn in. The
     padding also keeps everything inside the part of the picture a TV might crop. */
  .screen {
    position: absolute; inset: 0; padding: 2.6rem 4.6rem 2.6rem 3rem; gap: 1.4rem;
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
    transition: transform 20s ease-in-out, filter 3s;
  }
  body.resting .screen { filter: brightness(.45); }

  /* The face's own box, always in the top left. */
  /* Each part has its own row, so hiding one (the name, in a small box) never shifts the others. */
  .name { grid-row: 1; } #face { grid-row: 2; } .state { grid-row: 3; } .captions { grid-row: 4; }
  .main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; min-width: 0; min-height: 0; position: relative; overflow: hidden; border-radius: 1.6rem; }
  .glow {
    position: absolute; left: 50%; top: 42%; width: 70rem; height: 46rem; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, var(--state), transparent); opacity: .1; transition: opacity 1s;
  }
  .name { font-size: 1.6rem; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); position: relative; }
  canvas { width: 100%; height: 100%; min-height: 0; display: block; position: relative; }

  .status { display: flex; align-items: center; justify-content: center; gap: 1.2rem; position: relative; min-height: 4rem; }
  .status .dot { width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--state); transition: background .4s; }
  .status .word { font-size: 2.8rem; font-weight: 600; }
  .status .word:empty { display: none; }
  .status .detail { font-size: 1.8rem; color: var(--muted); }
  .level { height: .4rem; width: 26rem; margin: .7rem auto 0; background: var(--track); border-radius: .2rem; overflow: hidden; position: relative; }
  .level div { height: 100%; width: 100%; background: var(--state); transform-origin: left; transform: scaleX(0); transition: transform .1s linear; }

  .captions { height: 14rem; padding-top: 1.4rem; position: relative; transition: opacity 1.5s; }
  .captions.quiet { opacity: 0; }
  .line { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .said-to { color: var(--muted); font-size: 1.8rem; -webkit-line-clamp: 1; line-clamp: 1; text-align: center; }
  .said-back { font-size: 2.5rem; font-weight: 500; -webkit-line-clamp: 3; line-clamp: 3; text-align: center; text-wrap: balance; margin-top: .3rem; }

  /* Across the whole screen, so an alarm shows whichever dashboard is up. */
  .banner {
    position: absolute; left: 3.5rem; right: 3.5rem; bottom: 4rem; padding: 1.5rem 2rem; border-radius: 1.2rem; z-index: 2;
    background: var(--warning); color: #15130c; font-size: 3rem; font-weight: 700; text-align: center; display: none;
    animation: pulse 1s ease-in-out infinite alternate;
  }
  body.ringing .banner { display: block; }
  body.ringing .captions { opacity: 1; }
  body.ringing .line { visibility: hidden; }
  @keyframes pulse { to { opacity: .72; } }

  /* Every section is a box of its own, placed on the grid, that pops in, slides when it moves and
     pops out. What's inside fits itself to the box's size (the @container rules). */
  .box {
    display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; container-type: size;
    background: linear-gradient(160deg, #17171d, #111115); border: 1px solid var(--line); border-radius: 1.6rem;
    padding: 1.5rem 1.9rem; box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, .45);
  }
  .box h2 { margin: 0 0 .7rem; padding: 0; border: 0; }
  .box.leaving { position: fixed; margin: 0; z-index: 3; pointer-events: none; animation: pop-out .32s ease-in forwards; }
  @keyframes pop-in { from { opacity: 0; transform: scale(.82); } 60% { opacity: 1; } }
  @keyframes pop-out { to { opacity: 0; transform: scale(.82); } }
  .clock-section { justify-content: center; }

  /* A box Pip was asked to colour: its edge, title and highlights take the colour. */
  .box.tinted {
    border-color: color-mix(in srgb, var(--tint) 55%, var(--line));
    background: linear-gradient(160deg, color-mix(in srgb, var(--tint) 15%, #17171d), #111115);
  }
  .box.tinted h2, .box.tinted .clock, .box.tinted .temp { color: var(--tint); }
  .box.tinted .meter:not(.warning):not(.critical) .bar div { background: var(--tint); }

  /* Every kind of box there could be, down the right edge, so everyone knows what they can ask for.
     Faint dots most of the time; for a little while after the screen changes, or when asked, it
     lights up with names. The ones on the screen are lit, in their colour. */
  #rail {
    position: absolute; right: .9rem; top: 50%; transform: translateY(-50%); z-index: 2;
    display: flex; flex-direction: column; gap: 1.3rem; padding: 1.6rem 1rem;
    opacity: .35; transition: opacity 1.2s;
  }
  #rail::before {  /* a soft shadow behind the names, so they read over whatever box they cross */
    content: ""; position: absolute; inset: -6rem -2rem -6rem -10rem; z-index: -1; opacity: 0; transition: opacity 1.2s;
    background: radial-gradient(farthest-side at 100% 50%, rgba(9, 9, 12, .96) 62%, rgba(9, 9, 12, 0));
  }
  #rail.awake, #rail.awake::before { opacity: 1; }
  .pick { display: flex; flex-direction: row-reverse; align-items: center; gap: 1rem; color: var(--muted); font-size: 1.5rem; white-space: nowrap; }
  .pick .dot { flex: none; width: 1.1rem; height: 1.1rem; border-radius: 50%; border: .2rem solid var(--line); }
  .pick.on .dot { border-color: var(--pick); background: var(--pick); box-shadow: 0 0 .8rem var(--pick); }
  .pick.on { color: var(--ink); font-weight: 600; }
  .pick .label { max-width: 0; overflow: hidden; opacity: 0; transition: max-width 1s, opacity .8s; }
  #rail.awake .pick .label { max-width: 20rem; opacity: 1; }
  .upcoming { flex: 1 1 0; min-height: 0; overflow: hidden; }
  @container (max-height: 15rem) { .box .day { display: none; } }
  @container (max-height: 11rem) { .feels { display: none; } }
  @container (min-width: 46rem) { #meters { grid-template-columns: repeat(4, 1fr); } }

  /* A small face box keeps just the face and what it's doing. */
  body.face-compact .name, body.face-compact .glow { display: none; }
  body.face-compact .status .detail { font-size: 1.3rem; width: 100%; text-align: center; }
  body.face-compact .status { flex-wrap: wrap; gap: .6rem; min-height: 0; }
  body.face-compact .status .word { font-size: 1.8rem; }
  body.face-compact .level { width: 80%; }
  body.no-captions .captions { display: none; }
  body.no-captions.ringing .captions { display: block; height: auto; }
  .body { flex: 1 1 0; min-height: 0; overflow: hidden; }
  /* The newest stays in view, and the oldest fades out instead of being cut through. */
  .stack { display: flex; flex-direction: column; justify-content: flex-end; -webkit-mask-image: linear-gradient(transparent, #000 3rem); mask-image: linear-gradient(transparent, #000 3rem); }
  .said { padding: .35rem 0; }
  .said b { color: var(--muted); font-weight: 600; }
  .said.back b { color: var(--state); }
  .now { display: flex; align-items: center; gap: 1.6rem; }
  .temp { font-size: min(5rem, 30cqh, 20cqw); font-weight: 300; line-height: 1.1; white-space: nowrap; }
  .sky { font-size: 2rem; line-height: 1.15; }
  .feels { color: var(--muted); font-size: 1.4rem; margin: .3rem 0 .7rem; }
  .day { display: grid; grid-template-columns: 3rem minmax(0, 1fr) 4.8rem 5.8rem; gap: .6rem; padding: .2rem 0; align-items: baseline; font-size: 1.4rem; }
  .day > * { white-space: nowrap; }
  .day > :last-child { text-align: right; }
  .day .words { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .rain, .day .name-of-day { color: var(--muted); }
  .clock { font-size: min(5.6rem, 52cqh, 23cqw); font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .clock small { font-size: 2.4rem; color: var(--muted); margin-left: .5rem; letter-spacing: 0; }
  .date { color: var(--muted); font-size: min(1.9rem, 16cqh, 8cqw); margin-top: .5rem; }
  h2 { margin: 1.3rem 0 .6rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 1.4rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

  .item { display: flex; justify-content: space-between; align-items: baseline; gap: 1.2rem; padding: .35rem 0; }
  .item .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .item .when { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .item.soon .when { color: var(--ink); font-weight: 600; }
  .none { color: var(--muted); }

  #meters { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem 2rem; }
  .meter[hidden] { display: none; }
  .meter .top { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; }
  .meter .top span:first-child { color: var(--muted); }
  .meter .value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .meter .alarm { font-size: 1.3rem; margin-left: .5rem; font-weight: 600; color: var(--ink); }
  .bar { height: .5rem; background: var(--track); border-radius: .25rem; margin-top: .3rem; overflow: hidden; }
  .bar div { height: 100%; background: var(--muted); border-radius: .25rem; transition: width 1s; }
  .warning .bar div { background: var(--warning); }
  .critical .bar div { background: var(--critical); }
  /* Until the screen module says otherwise: the face fills the screen. */
  #face-box { grid-area: 1 / 1 / span 8 / span 12; }
  #board { display: contents; }
  body.dim .screen { filter: brightness(.45); }   /* the Night screen */
  .note { padding: .4rem 0; border-bottom: 1px solid var(--line); }
  .note:last-child { border-bottom: 0; }
  .said.room { color: var(--muted); }
  .said.room b { font-weight: 500; }
  .said.you b { color: var(--good); }
  .box h2 { margin-top: 0; padding-top: 0; border-top: 0; }
  .box.empty { opacity: .5; }
  .timer-left { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
  .item .what small { color: var(--muted); margin-right: .7rem; text-transform: uppercase; letter-spacing: .08em; font-size: 1.1rem; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main" id="face-box">
    <div class="glow"></div>
    <div class="name" id="name">Pip</div>
    <canvas id="face"></canvas>
    <div class="state">
      <div class="status"><span class="dot"></span><span class="word" id="word">Starting up</span><span class="detail" id="detail"></span></div>
      <div class="level"><div id="level"></div></div>
    </div>
    <div class="captions quiet" id="captions">
      <div class="line said-to" id="saidTo"></div>
      <div class="line said-back" id="saidBack"></div>
    </div>
  </div>
  <div id="board"></div>
  <div class="banner" id="banner"></div>
</div>
<div id="rail"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const CAPTION_S = 60;     // what was said leaves the screen after this long
const DOZE_S = 600;       // idle this long with nobody talking to him: he dozes (less motion, PIP-NEW-062)
const SILENCE_S = 40;     // nothing at all for this long, and it counts as unreachable
const RECONNECT_S = 3;

// --- The face ---------------------------------------------------------------------------------
// Each expression is a set of targets the face eases towards, so every change is a smooth motion.
//   w, h: eye size     open: how open the eyes are     happy: cheeks pushing the eyes up into arcs
//   slant: + worried, - focused     look: where it's looking    smile: -1 frown to 1 grin
//   mouth: mouth width     gape: mouth open     lean: extra size, as if leaning in
const REST = { w: 1, h: 1, open: 1, happy: 0, slant: 0, lookX: 0, lookY: 0, smile: .35, mouth: 1, gape: 0, lean: 0 };
// Pip's states (what pip-core says he's doing), plus three of the screen's own: loading (the page has
// just opened), lost (it can't reach Pip) and dozing (idle and quiet for a while).
const FACES = {
  loading:     { open: .35, smile: 0, mouth: .6, lookY: .3 },
  idle:        {},
  listening:   { h: 1.06, lean: .04, smile: .25, mouth: .8, gape: .05 },
  thinking:    { open: .85, slant: -.2, lookX: .6, lookY: -.7, smile: -.05, mouth: .5 },
  speaking:    { smile: .3, mouth: .95 },
  interrupted: { h: 1.12, slant: .3, smile: -.1, mouth: .6, gape: .25, lookY: -.1 },
  ringing:     { w: 1.05, h: 1.2, smile: 0, mouth: .55, gape: .9, lean: .08 },
  mic_off:     { open: .55, slant: .3, smile: -.05, mouth: .5, lookY: .25 },
  offline:     { open: .8, slant: .4, smile: -.2, mouth: .7, lookY: .2 },   // no internet: just the basics
  lost:        { open: .5, slant: .9, smile: -.75, mouth: .7, lookY: .5 },
  dozing:      { open: .3, slant: .25, lookY: .35, smile: .15, mouth: .7 },
  // What exactly he's doing within a state (D-112; the details and their words are in core/states.py).
  // A detail with no entry here uses its state's face.
  "listening:called":         { h: 1.15, lean: .08, smile: .45, mouth: .85, gape: .08 },          // heard his name: go on
  "listening:hearing":        { h: 1.08, lean: .06, slant: -.12, smile: .15, mouth: .7 },           // working out what you said
  "listening:turn":           { open: .9, smile: .3, mouth: .75, lookY: .1 },                       // patient, nodding
  "listening:follow_up":      { h: 1.12, slant: -.08, smile: .45, mouth: .8, gape: .12, lean: .03 },// expectant
  "listening:learning_voice": { h: 1.05, lean: .05, slant: -.25, smile: .1, mouth: .6 },
  "thinking:searching":       { open: .85, slant: -.2, lookY: -.2, smile: 0, mouth: .5 },           // eyes scan side to side
  "thinking:looking_up":      { open: .75, slant: -.15, lookY: .6, smile: 0, mouth: .5 },           // reading
  "thinking:voice":           { smile: .3, mouth: .9, gape: .15 },                                  // about to talk
  "idle:following":           { open: .92, smile: .25, mouth: .85 },                                // glancing about the room
  "idle:mentioned":           { slant: .35, lookX: .55, lookY: -.15, smile: .05, mouth: .65 },      // "hm? is that for me?"
  "idle:joining":             { happy: .3, lookX: -.5, smile: .55, mouth: .9 },                     // a sly half-smile
  "speaking:joining_in":      { smile: .55, mouth: 1 },
  "speaking:welcome":         { h: .8, happy: .7, smile: .9, mouth: 1.05 },
  // Brief reactions, on top of whatever it's doing:
  pleased:     { h: .72, happy: 1, smile: 1, mouth: 1.15 },   // thanked
  perked:      { h: 1.12, lean: .06, smile: .5 },             // it's just heard something for it
};
// Pip's state colours, the same as the circle on the dashboard (D-108), brighter for a dark screen.
const COLORS = {
  loading: "#a8a8b4", idle: "#b9bec6", listening: "#5fe0b0", thinking: "#a58cff", speaking: "#6ea8ff",
  interrupted: "#ffa64d", ringing: "#ff6b5e", mic_off: "#6b7280", offline: "#8c96a8", lost: "#ff6b5e",
  dozing: "#7fb2dc", pleased: "#6ea8ff", perked: "#5fe0b0",
};
// The big word for each state. The smaller words under it come from pip-core (core/states.py), except for
// the screen's own three states, which have theirs here.
const WORDS = {
  loading: "Starting up", idle: "Idle", listening: "Listening", thinking: "Thinking", speaking: "Talking",
  interrupted: "Interrupted", ringing: "Ringing", mic_off: "Not listening", offline: "Offline",
  lost: "Can't reach Pip", dozing: "Dozing",
};
const SCREEN_WORDS = { loading: "Connecting to Pip…", lost: "Trying again…", dozing: "Quiet for a while: say my name" };

// --- "Six seven" ------------------------------------------------------------------------------
// A joke kept from Ziggletron (D-35, D-121): when someone says "six seven" (to Pip or just in the room), he
// freaks out for a few seconds: wide eyes, a grin, a little shake, two hands see-sawing (the meme) and "6" "7"
// floating up, while he chants it. Hearing it is the six_seven module's job (modules/six_seven), which asks for
// this reaction; at most once every half a minute so it stays funny (the calm rule, PIP-NEW-062).
const SIXSEVEN = {
  seconds: 4, every: 30,
  face: { w: 1.08, h: 1.18, smile: .75, mouth: 1.15, gape: .7, lean: .07, lookY: -.15 },
  color: "#ffb347",
};
FACES.sixseven = SIXSEVEN.face;
COLORS.sixseven = SIXSEVEN.color;

const canvas = $("face"), ctx = canvas.getContext("2d");
const face = { ...REST, ...FACES.loading };
const body = { color: [168, 168, 180], blink: 1, saccadeX: 0, saccadeY: 0, voice: 0, gape: 0 };
const live = { state: "loading", detail: "", words: "", endsAt: 0, endsFrom: 0, reaction: null, reactionUntil: 0, sixSevenAt: -Infinity, connected: false,
               lastEvent: 0, voiceAt: 0, voiceTarget: 0, activeAt: 0, weather: {}, align: "middle" };
let particles = [];

function hexRgb(hex) { return [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)); }
function shown() {  // the state the screen is in
  if (!live.connected) return live.wasLost ? "lost" : "loading";
  if (live.state === "idle" && performance.now() - live.activeAt > DOZE_S * 1000) return "dozing";  // calmer when quiet
  return live.state;
}
function expression() {  // the state (or what exactly he's doing in it), or a reaction on top of it
  const state = shown(), detailed = `${state}:${live.detail}`;
  if (live.reaction && performance.now() < live.reactionUntil) {
    // Six seven is too much to keep in, whatever he's doing; only an alarm or losing touch comes first.
    if (live.reaction === "sixseven" && state !== "lost" && state !== "ringing") return "sixseven";
    // Other reactions colour his quiet moments; they don't hide that he's busy. He can smile while talking.
    if (["idle", "listening", "dozing"].includes(state) || (state === "speaking" && live.reaction === "pleased"))
      return live.reaction;
  }
  return live.detail && FACES[detailed] ? detailed : state;
}
function react(name, seconds) { live.reaction = name; live.reactionUntil = performance.now() + seconds * 1000; }
function sixSeven() {
  const now = performance.now();
  if (now - live.sixSevenAt < SIXSEVEN.every * 1000) return;
  live.sixSevenAt = now;
  react("sixseven", SIXSEVEN.seconds);
}

// One eye, as an outline: a rounded square whose top is held down by the lid and bottom pushed up
// by the cheek. Keeping it one shape means the glow follows the lids properly.
function eyePath(side, cx, cy, width, height) {
  const a = width / 2, b = Math.max(height * face.open * body.blink, height * .035) / 2;
  const path = new Path2D(), edge = [];
  for (let i = 0; i <= 48; i++) {
    const u = Math.sin((i / 48 - .5) * Math.PI);           // -1 to 1 across the eye, closer together at the ends
    const round = (1 - u ** 4) ** .25;
    // Worried: the outer corners droop. Focused: the inner corners do.
    const where = face.slant >= 0 ? (side * u + 1) / 2 : (1 - side * u) / 2;
    const top = Math.max(-b * round, -b + Math.abs(face.slant) * b * .8 * where);
    const bottom = Math.max(top, Math.min(b * round, b - face.happy * b * 1.7 * (1 - u * u)));
    edge.push([u * a, top, bottom]);
  }
  edge.forEach(([x, top], i) => i ? path.lineTo(cx + x, cy + top) : path.moveTo(cx + x, cy + top));
  edge.reverse().forEach(([x, , bottom]) => path.lineTo(cx + x, cy + bottom));
  path.closePath();
  return path;
}

function draw(now) {
  const W = canvas.width, H = canvas.height, u = Math.min(W / 11, H / 6.2);
  const rgb = body.color.map(Math.round).join(",");
  ctx.clearRect(0, 0, W, H);
  ctx.lineJoin = ctx.lineCap = "round";
  const state = expression(), t = now / 1000;

  // A slow float, as if breathing; a slow nod while he waits for you to finish. It shakes when an alarm
  // rings, and a little at six seven.
  const floatY = Math.sin(t * .9) * u * .09 + (state === "listening:turn" ? Math.max(0, Math.sin(t * 2.2)) * u * .12 : 0);
  const swayX = Math.sin(t * .37) * u * .06;
  const shake = shown() === "ringing" ? Math.sin(t * 46) * u * .09 : state === "sixseven" ? Math.sin(t * 38) * u * .05 : 0;
  // Where in its box the face sits: the top, middle or bottom (the face's "align" in the screen layout).
  const middle = { top: 3 * u, bottom: H - 2.8 * u }[live.align] ?? H * .5;
  const cx = W / 2 + swayX + shake, cy = Math.max(3 * u, Math.min(H - 2.8 * u, middle)) + floatY;
  const scale = 1 + face.lean;

  const gazeX = (face.lookX + body.saccadeX) * u * .55, gazeY = (face.lookY + body.saccadeY) * u * .4;
  const spread = u * 2.25 * scale, eyeW = u * 2.45 * face.w * scale, eyeH = u * 3.1 * face.h * scale;
  for (const side of [-1, 1]) {
    // Looking sideways, the far eye narrows a touch, which gives the flat face some depth.
    const narrow = 1 - Math.abs(face.lookX + body.saccadeX) * .1 * (side * (face.lookX + body.saccadeX) < 0 ? 1 : 0);
    const path = eyePath(side, cx + side * spread + gazeX, cy - u * .35 + gazeY, eyeW * narrow, eyeH);
    for (const [width, alpha] of [[.62, .05], [.36, .08], [.16, .16]]) {
      ctx.lineWidth = u * width; ctx.strokeStyle = `rgba(${rgb},${alpha})`; ctx.stroke(path);
    }
    ctx.fillStyle = `rgb(${rgb})`; ctx.fill(path);
  }

  // The mouth: two curves that part as it opens.
  const mx = cx + gazeX * .6, my = cy + u * 1.95 + gazeY * .5;
  const gape = clamp(body.gape, 0, 1);
  const half = u * .95 * face.mouth * (1 - gape * .32), bow = face.smile * u * .62 * (1 - gape * .5), open = gape * u * 1.05;
  const mouth = new Path2D();
  mouth.moveTo(mx - half, my);
  mouth.bezierCurveTo(mx - half * .75, my + bow - open * .5, mx + half * .75, my + bow - open * .5, mx + half, my);
  mouth.bezierCurveTo(mx + half * .85, my + bow + open, mx - half * .85, my + bow + open, mx - half, my);
  mouth.closePath();
  ctx.lineWidth = u * .42; ctx.strokeStyle = `rgba(${rgb},.06)`; ctx.stroke(mouth);
  ctx.lineWidth = u * .2; ctx.strokeStyle = `rgb(${rgb})`; ctx.stroke(mouth);
  ctx.fillStyle = `rgb(${rgb})`; ctx.fill(mouth);

  drawAccessory(wearing(), t, cx, cy, u, { spread, eyeY: cy - u * .35 + gazeY, gazeX, eyeW, eyeH });
  if (state === "sixseven") drawSixSevenHands(t, cx, cy, u, rgb);
  drawParticles(state, t, cx, cy, u, rgb);
}

// --- What it wears: it dresses for the weather (common/weather.py's dress() says what) ---------------
// Everything is measured in u, like the face, so it fits any size of box.
// November to Twelfth Night, a warm hat is a Santa hat. With no forecast yet, it wears one anyway then.
function holidays(date) { return date.getMonth() >= 10 || (date.getMonth() === 0 && date.getDate() <= 6); }
function wearing() {
  const w = live.weather, festive = holidays(new Date());
  if (!w || w.wear === undefined) return festive ? "santa" : "";
  if (festive && w.wear === "beanie") return "santa";
  if (festive && w.wear === "snow") return "santa-snow";
  return w.wear;
}
function drawAccessory(what, t, cx, cy, u, eyes) {
  const hatY = cy - u * 2.2;
  if (what === "santa" || what === "santa-snow") drawSantaHat(cx, hatY, u);
  if (what === "beanie" || what === "snow") drawBeanie(cx, hatY, u);
  if (what === "snow" || what === "santa-snow") drawFalling(t, cx, cy, u);
  if (what === "umbrella") {  // the rain lands on the umbrella and drips off its edges
    drawUmbrellaHat(cx, hatY, u, t);
    drawRain(t, cx, u, { x: cx, half: u * 2, rim: hatY - u * .1, top: hatY - u * .85 });
  }
  if (what === "storm") { drawRain(t, cx, u, null); drawStormCloud(cx, cy - u * 2.75, u, t); }
  if (what === "sunglasses") drawSunglasses(cx, u, eyes);
}
function drawSantaHat(x, y, u) {
  ctx.fillStyle = "#d42a2a";
  ctx.beginPath();
  ctx.moveTo(x - u * 1.45, y);
  ctx.quadraticCurveTo(x - u * .3, y - u * 1.1, x + u * 1.35, y - u * .55);  // the tip flops to one side
  ctx.quadraticCurveTo(x + u * .6, y - u * .35, x + u * 1.45, y);
  ctx.fill();
  ctx.fillStyle = "#f4f4f4";
  ctx.beginPath(); ctx.roundRect(x - u * 1.65, y - u * .18, u * 3.3, u * .4, u * .2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + u * 1.35, y - u * .55, u * .22, 0, 7); ctx.fill();
}

// A knitted hat with a bobble, for cold days.
function drawBeanie(x, y, u) {
  ctx.fillStyle = "#3f8fd8";
  ctx.beginPath();
  ctx.moveTo(x - u * 1.5, y);
  ctx.bezierCurveTo(x - u * 1.5, y - u * 1.05, x + u * 1.5, y - u * 1.05, x + u * 1.5, y);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = u * .08;  // the knit
  for (const k of [-.75, 0, .75]) {
    ctx.beginPath(); ctx.moveTo(x + k * u, y - u * .1); ctx.quadraticCurveTo(x + k * u * 1.15, y - u * .45, x + k * u * .8, y - u * .65); ctx.stroke();
  }
  ctx.fillStyle = "#2c6fb0";
  ctx.beginPath(); ctx.roundRect(x - u * 1.65, y - u * .2, u * 3.3, u * .45, u * .15); ctx.fill();
  ctx.fillStyle = "#f4f4f4";
  ctx.beginPath(); ctx.arc(x, y - u * .85, u * .28, 0, 7); ctx.fill();
}

// A little umbrella worn as a hat, with the rain running off it.
function drawUmbrellaHat(x, y, u, t) {
  const top = y - u * .85, rim = y - u * .1, half = u * 2, tilt = Math.sin(t * .8) * .04;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(tilt); ctx.translate(-x, -y);
  ctx.strokeStyle = "#d8d8e0"; ctx.lineWidth = u * .1;
  ctx.beginPath(); ctx.moveTo(x, top - u * .2); ctx.lineTo(x, y + u * .05); ctx.stroke();  // the tip and shaft
  ctx.lineWidth = u * .14;
  ctx.beginPath(); ctx.moveTo(x - u * 1.2, y + u * .05); ctx.lineTo(x + u * 1.2, y + u * .05); ctx.stroke();  // the headband
  const canopy = new Path2D();  // a dome with a scalloped edge
  canopy.moveTo(x - half, rim);
  canopy.bezierCurveTo(x - half, top - u * .1, x + half, top - u * .1, x + half, rim);
  for (let i = 3; i >= 0; i--) {
    const from = x - half + ((i + 1) * half) / 2, to = from - half / 2;
    canopy.quadraticCurveTo((from + to) / 2, rim - u * .28, to, rim);
  }
  canopy.closePath();
  ctx.save(); ctx.clip(canopy);
  ["#ff6b6b", "#ffd25e", "#5aa9ff", "#6fdc7a"].forEach((color, i) => {  // four panels, fanning out from the tip
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(x, top - u);
    ctx.lineTo(x + (i - 2) * half * .75, rim + u * .2); ctx.lineTo(x + (i - 1) * half * .75, rim + u * .2);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();
  ctx.restore();
}

// A grumpy little cloud overhead, with lightning down between the eyes now and then.
function drawStormCloud(x, y, u, t) {
  y = Math.max(y, u * .55);  // kept on the screen in a short box
  const s = u * .6, beat = t % 4.2, flash = beat < .18 || (beat > .3 && beat < .42);
  if (flash) {
    ctx.fillStyle = "#ffe066";
    ctx.beginPath();
    ctx.moveTo(x + s * .1, y + s * .3); ctx.lineTo(x - s * .45, y + s * 1.2); ctx.lineTo(x - s * .05, y + s * 1.15);
    ctx.lineTo(x - s * .35, y + s * 2.1); ctx.lineTo(x + s * .45, y + s * .95); ctx.lineTo(x + s * .05, y + s * 1.0);
    ctx.lineTo(x + s * .35, y + s * .3);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = flash ? "#9ea3b5" : "#6b7084";
  for (const [dx, dy, r] of [[-1.1, .15, .6], [-.35, -.25, .8], [.55, -.1, .7], [1.2, .2, .5], [0, .3, .6]]) {
    ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill();
  }
}

// Snow falling past the face, either side of it.
function drawFalling(t, cx, cy, u) {
  const H = canvas.height;
  ctx.fillStyle = "rgba(240,244,255,.8)";
  for (let i = 0; i < 14; i++) {
    const seed = (i * 0.6180339) % 1, side = i % 2 ? 1 : -1;
    const x = cx + side * u * (3.9 + seed * 1.6) + Math.sin(t * 1.3 + i) * u * .25;
    const y = ((seed * H + t * .9 * u) % (H + u)) - u * .5;
    ctx.beginPath(); ctx.arc(x, y, u * (.08 + seed * .07), 0, 7); ctx.fill();
  }
}

// Rain falling right down over the face. With a `roof` (the umbrella hat: its middle x, half its
// width, and the y of its edge and top) drops above it land on it with a splash, and drip off its edges.
function drawRain(t, cx, u, roof) {
  const H = canvas.height, count = 34, fall = u * 4.5, len = u * .4, slant = u * .08;
  ctx.strokeStyle = ctx.fillStyle = "rgba(130,180,255,.6)";
  ctx.lineWidth = u * .07;
  for (let i = 0; i < count; i++) {
    // Spread evenly across the face and a little beyond, each at its own point in its fall.
    const x = cx + ((i + .5) / count * 2 - 1) * u * 5.6 + (((i * 0.7548) % 1) - .5) * u * .3;
    const y = (((i * 0.6180339) % 1) * H + t * fall) % (H + len * 2) - len;
    let end = y + len;
    if (roof && Math.abs(x - roof.x) < roof.half) {
      const across = (x - roof.x) / roof.half;
      const surface = roof.rim - (roof.rim - roof.top) * (1 - across * across) * .9;
      if (y > surface) continue;  // sheltered
      if (end > surface) {  // landing: a little splash
        end = surface;
        ctx.beginPath(); ctx.arc(x, surface, u * .12 * (1 - (surface - y) / len), Math.PI, 0); ctx.stroke();
      }
    }
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - slant * (end - y) / len, end); ctx.stroke();
  }
  if (!roof) return;
  for (const side of [-1, 1]) {  // drips running off each edge of the umbrella
    for (let k = 0; k < 3; k++) {
      const age = (t * 1.6 + k / 3 + (side > 0 ? .5 : 0)) % 1;
      const x = roof.x + side * (roof.half - u * .1), y = roof.rim + age * age * u * 4;
      ctx.globalAlpha = 1 - age;
      ctx.beginPath(); ctx.arc(x, y, u * .09, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// Shades for sunny days, over the eyes, which glow through a little so it still has its expressions.
function drawSunglasses(cx, u, { spread, eyeY, gazeX, eyeW, eyeH }) {
  const w = Math.max(eyeW, u * 2.3) * 1.18, h = Math.min(eyeH, u * 3.1) * .62, y = eyeY - eyeH * .12;
  ctx.fillStyle = "rgba(14,14,24,.78)"; ctx.strokeStyle = "#20202c"; ctx.lineWidth = u * .16;
  for (const side of [-1, 1]) {
    const x = cx + side * spread + gazeX;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, [u * .25, u * .25, u * .7, u * .7]); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = u * .09;  // a glint
    ctx.beginPath(); ctx.moveTo(x - w * .3, y - h * .25); ctx.lineTo(x - w * .1, y - h * .25); ctx.stroke();
    ctx.strokeStyle = "#20202c"; ctx.lineWidth = u * .16;
  }
  ctx.beginPath();  // the bridge
  ctx.moveTo(cx + gazeX - spread + w / 2, y - h * .2);
  ctx.quadraticCurveTo(cx + gazeX, y - h * .45, cx + gazeX + spread - w / 2, y - h * .2);
  ctx.stroke();
}

// The six-seven hands: the only time he has hands. Two little glowing ones, drawn like his eyes and
// mouth, palms up, see-sawing up and down opposite each other.
function drawSixSevenHands(t, cx, cy, u, rgb) {
  const beat = Math.sin(t * Math.PI * 2 * 2.1);  // about two bounces a second, like the meme
  const k = u * .5;  // the hand's size: little, next to its eyes
  for (const side of [-1, 1]) {
    // Just outside its eyes, level with their lower half, one up while the other's down.
    const x = cx + side * u * 4.5, y = cy + u * 1.35 - side * beat * u * .55;
    const tilt = side * beat * .14;  // tipping as they go, like weighing something in each hand
    // A cupped palm facing up, drawn for the right hand (thumb towards the face, fingers out to the
    // side) and mirrored for the left.
    const hand = new Path2D();
    hand.moveTo(-1.05 * k, -.75 * k);                                         // the thumb's tip
    hand.quadraticCurveTo(-.7 * k, -.75 * k, -.62 * k, -.2 * k);              // down the inside of the thumb
    hand.quadraticCurveTo(.2 * k, .05 * k, .95 * k, -.25 * k);                // across the open palm
    hand.quadraticCurveTo(1.25 * k, -.55 * k, 1.5 * k, -.5 * k);              // the fingers, curling up
    hand.quadraticCurveTo(1.8 * k, -.4 * k, 1.55 * k, -.05 * k);              // round the fingertips
    hand.quadraticCurveTo(1.1 * k, .75 * k, .05 * k, .72 * k);                // under the fingers and palm
    hand.quadraticCurveTo(-1.05 * k, .7 * k, -1.25 * k, -.2 * k);             // the heel of the hand
    hand.quadraticCurveTo(-1.35 * k, -.75 * k, -1.05 * k, -.75 * k);          // back up the thumb
    hand.closePath();
    ctx.save();
    ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(side, 1);
    for (const [width, alpha] of [[.5, .05], [.3, .08], [.14, .16]]) {  // the same soft glow as its eyes
      ctx.lineWidth = u * width; ctx.strokeStyle = `rgba(${rgb},${alpha})`; ctx.stroke(hand);
    }
    ctx.fillStyle = `rgb(${rgb})`; ctx.fill(hand);
    ctx.restore();
  }
}

// Thought dots while thinking (or starting up); floating glyphs for some states: sleepy z's while he
// dozes, "6" and "7" at six seven. Each glyph rises, grows and fades over a few seconds.
const GLYPHS = {
  dozing:   { chars: "zZz", every: 1.9, swap: 1, side: () => 1 },                          // to one side, slowly
  sixseven: { chars: "67", every: .6, swap: 2.5, side: (t) => Math.sign(Math.sin(t * 7.3)) || 1 },  // both sides, fast
};
const GLYPH_S = 4.5, MAX_GLYPHS = 12;
function drawParticles(state, t, cx, cy, u, rgb) {
  if (state.startsWith("thinking") || state === "loading" || state === "idle:mentioned" || state === "idle:joining") {
    for (let i = 0; i < 3; i++) {
      const phase = t * 2.4 - i * .55, x = cx + (i - 1) * u * .85, y = cy - u * 2.6;
      const glow = .3 + .7 * Math.max(0, Math.sin(phase));
      ctx.fillStyle = `rgba(${rgb},${glow})`;
      ctx.beginPath(); ctx.arc(x, y - glow * u * .15, u * .17, 0, 7); ctx.fill();
    }
  }
  const g = GLYPHS[state];
  if (g && (!particles.length || particles.at(-1).born < t - g.every) && particles.length < MAX_GLYPHS)
    particles.push({ state, born: t, glyph: g.chars[Math.floor(t * g.swap) % g.chars.length], side: g.side(t), drift: (t * 3.7) % 1 });
  particles = particles.filter((p) => p.state === state && t - p.born < GLYPH_S);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const p of particles) {
    const age = (t - p.born) / GLYPH_S;
    ctx.globalAlpha = Math.sin(Math.PI * age) * .9;
    ctx.fillStyle = `rgb(${rgb})`;
    ctx.font = `600 ${u * (.55 + age * .55)}px system-ui, "DejaVu Sans", sans-serif`;
    ctx.fillText(p.glyph, cx + p.side * (u * 4.3 + age * u * (.8 + p.drift)) + Math.sin(age * 9) * u * .2, cy - u * .6 - age * u * 1.9);
  }
  ctx.globalAlpha = 1;
}

let lastFrame = 0, nextBlink = 2500, blinkStart = -1, nextSaccade = 1500;
function step(now) {
  requestAnimationFrame(step);
  const state = expression();
  const resting = ["dozing", "mic_off", "lost"].includes(shown());
  if (now - lastFrame < (resting ? 66 : 32)) return;          // 30 frames a second, 15 at rest: it's on all day
  const dt = Math.min((now - lastFrame) / 1000, .25); lastFrame = now;
  const ease = (rate) => 1 - Math.exp(-rate * dt);

  const target = { ...REST, ...FACES[state] };
  for (const key in REST) face[key] += (target[key] - face[key]) * ease(key === "happy" ? 9 : 6.5);
  const rgb = hexRgb(COLORS[state] || COLORS[state.split(":")[0]] || COLORS.idle);   // a detail keeps its state's colour
  body.color = body.color.map((c, i) => c + (rgb[i] - c) * ease(4));

  // Blinks, sometimes twice, and small glances about.
  if (now > nextBlink && blinkStart < 0) {
    blinkStart = now;
    nextBlink = now + (Math.random() < .18 ? 320 : 2200 + Math.random() * 4200);
  }
  if (blinkStart >= 0) {
    const p = (now - blinkStart) / 170;
    body.blink = p >= 1 ? 1 : Math.abs(1 - 2 * p);
    if (p >= 1) blinkStart = -1;
  }
  if (state === "thinking:searching") {   // scanning, as if reading results
    body.saccadeX = Math.sin(now / 260) * .55; body.saccadeY = 0;
  } else if (now > nextSaccade) {
    // Following room talk he glances about more often, from one speaker to another.
    nextSaccade = now + (state === "idle:following" ? 700 + Math.random() * 1600 : 1400 + Math.random() * 4400);
    const still = resting || state.startsWith("thinking") || state === "listening:hearing";
    body.saccadeX = still ? 0 : Math.random() < .35 ? 0 : (Math.random() - .5) * 1.1;
    body.saccadeY = still ? 0 : Math.random() < .5 ? 0 : (Math.random() - .5) * .55;
  }

  // The mouth follows his real voice (speech.level from pip-ears). If that isn't coming through, it
  // still moves while he talks.
  body.voice += (live.voiceTarget - body.voice) * ease(20);
  const heardVoice = now - live.voiceAt < 800;
  const talking = shown() === "speaking";
  const made = heardVoice ? clamp(body.voice * 4, 0, 1) : .35 + .3 * Math.sin(now / 75) * Math.sin(now / 190);
  const wanted = talking ? made : target.gape;
  body.gape += (wanted - body.gape) * ease(talking ? 22 : 8);

  showCountdown(now);
  draw(now);
}

function fitCanvas() {
  // Its laid-out size, not what's on screen right now: that's wrong while its box slides to a new place.
  const width = canvas.clientWidth, height = canvas.clientHeight;
  // No need for more detail than this on a soft glowing face, even on a 4K screen.
  const scale = Math.min(window.devicePixelRatio || 1, 1000 / Math.max(height, 1));
  canvas.width = Math.round(width * scale);
  canvas.height = Math.round(height * scale);
}

// --- The boxes ------------------------------------------------------------------------------------
// The screen module (modules/screen, D-111) says what's on the screen: the face's size and each box's
// kind and place on the 12×8 grid. Each kind has a function that fills its box; it runs again whenever
// what it shows changes. The layout and box animations are Ziggletron's. The screen's own kinds are in
// BOXES below; other modules add theirs (the calendar, a to-do list) in their static/monitor.js, which
// calls PipMonitor.box(kind, draw): draw(box, section, data, h) gets what that module's tv() sent
// (data.boxes[kind]) and the helpers in h.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const KEEP_LINES = 40, LINE_S = 15 * 60;   // the conversation box: the last 40 lines, none older than 15 minutes
const VITALS_S = 10;                       // how often the Pi health box updates
let data = { alerts: [], boxes: {}, weather: {}, now: Date.now() / 1000 }, skew = 0;
const said = [];   // the conversation box's lines: {who: "room" | "you" | "pip", speaker, text, at}

function showState() {
  const state = shown();
  document.documentElement.style.setProperty("--state", COLORS[state] || COLORS.idle);
  document.body.classList.toggle("ringing", state === "ringing");
  document.body.classList.toggle("offline", state === "lost");
  document.body.classList.toggle("resting", state === "dozing");
  $("word").textContent = WORDS[state] ?? "";
  $("detail").textContent = SCREEN_WORDS[state] ?? (live.state === state ? live.words : "");
}

function showCaption(who, text, speaker) {
  if (who === "pip") $("saidBack").textContent = text;
  else {
    $("saidTo").textContent = (speaker && speaker !== "Someone" ? speaker + ": " : "") + "“" + text + "”";
    $("saidBack").textContent = "";
  }
  $("captions").classList.remove("quiet");
  clearTimeout(live.captionTimer);
  live.captionTimer = setTimeout(() => $("captions").classList.add("quiet"), CAPTION_S * 1000);
}

function left(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}` : `${m}:${String(sec).padStart(2, "0")}`;
}
const at = (ts) => new Date(ts * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const serverNow = () => Date.now() / 1000 - skew;
const none = (text) => `<div class="none">${esc(text)}</div>`;
function fill(box, title, html) { box.innerHTML = (title ? `<h2>${esc(title)}</h2>` : "") + html; }

const BOXES = {
  clock(box) {
    const d = new Date();
    const [hm, ampm] = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).split(" ");
    box.classList.add("clock-section");
    fill(box, "", `<div class="clock">${esc(hm)}${ampm ? `<small>${esc(ampm)}</small>` : ""}</div>
      <div class="date">${esc(d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }))}</div>`);
  },
  weather(box) {
    const w = data.weather || {};
    if (w.temp === undefined) return fill(box, "Weather", none("No forecast yet"));
    fill(box, "Weather", `<div class="body"><div class="now"><div class="temp">${w.temp}°</div><div><div class="sky">${esc(w.sky)}</div>
      <div class="feels">feels like ${w.feels}°</div></div></div>` +
      (w.days || []).slice(0, 2).map((d) => `<div class="day"><span class="name-of-day">${esc(d.name.slice(0, 3))}</span>
        <span class="words">${esc(d.sky)}</span><span>${d.high}°/${d.low}°</span><span class="rain">${d.rain}% rain</span></div>`).join("") + `</div>`);
  },
  timers(box) {
    const now = serverNow();
    const rows = data.alerts.filter((a) => a.state !== "ringing").slice(0, 6).map((a) => {
      const kind = { timer: "timer", alarm: "alarm", reminder: "reminder", event: "soon" }[a.kind] || a.kind;
      const name = a.label && !["timer", "alarm"].includes(a.label) ? esc(a.label) : "";
      const when = a.kind === "timer" ? `<span class="timer-left">${left(a.due - now)}</span>` : at(a.due);
      return `<div class="item"><span class="what"><small>${kind}</small>${name}</span><span class="when">${when}</span></div>`;
    });
    fill(box, "Timers & alarms", `<div class="body">${rows.join("") || none("Nothing set")}</div>`);
    box.classList.toggle("empty", !rows.length);
  },
  notes(box, section) {
    fill(box, section.title || "Notes", `<div class="body">${(section.lines || []).map((l) => `<div class="note">${esc(l)}</div>`).join("") || none("Nothing written yet")}</div>`);
  },
  health(box) {
    const v = data.vitals || {};
    const meter = (name, value, unit, warn, bad) => value == null ? "" :
      `<div class="meter ${value >= bad ? "critical" : value >= warn ? "warning" : ""}"><div class="top"><span>${name}</span><span class="value">${Math.round(value)}${unit}</span></div>
       <div class="bar"><div style="width:${clamp(value, 0, 100)}%"></div></div></div>`;
    fill(box, "Pi health", `<div id="meters">${meter("Processor", v.cpu, "%", 70, 90)}${meter("Memory", v.memory, "%", 75, 90)}
      ${meter("Temperature", v.temp_c, "°C", 70, 80)}${meter("SD card", v.disk, "%", 80, 92)}</div>` +
      (v.programs ? `<div class="feels" style="margin-top:.8rem">${v.programs_ok} of ${v.programs} programs running</div>` : ""));
  },
  conversation(box, section) {
    const cutoff = serverNow() - LINE_S;
    const lines = said.filter((l) => l.at > cutoff && (section.room !== false || l.who !== "room"));
    fill(box, "Conversation", `<div class="body stack">${lines.map((l) => {
      const who = l.who === "pip" ? "Pip" : l.speaker && l.speaker !== "Someone" ? l.speaker : "Someone";
      return `<div class="said ${l.who}"><b>${esc(who)}${l.who === "you" ? " → Pip" : ""}:</b> ${esc(l.text)}</div>`;
    }).join("") || none("Nothing said yet")}</div>`);
  },
};

// Modules' kinds of box (module.toml [monitor.<kind>]), each drawn by its module's static/monitor.js.
const MODULE_BOXES = {};
const H = { fill, esc, none, at, serverNow };   // what a module's drawing may use
window.PipMonitor = { box(kind, draw) { MODULE_BOXES[kind] = draw; redraw(kind); } };
const loadedScripts = new Set();
function loadBoxScripts(urls) {
  for (const url of urls || []) {
    if (loadedScripts.has(url)) continue;
    loadedScripts.add(url);
    const tag = document.createElement("script");
    tag.src = url;
    document.head.appendChild(tag);
  }
}

function boxes(type) { return [...$("board").children].filter((b) => !type || b.dataset.type === type); }
function drawBox(box) {
  const type = box.dataset.type;
  if (BOXES[type]) return BOXES[type](box, box.section);
  if (MODULE_BOXES[type]) {
    try { MODULE_BOXES[type](box, box.section, (data.boxes || {})[type] || {}, H); } catch (e) { console.error(type, e); }
  }
}
function redraw(...types) {
  for (const box of boxes()) if (!types.length || types.includes(box.dataset.type)) drawBox(box);
}
function showBanner() {
  const ringing = data.alerts.filter((a) => a.state === "ringing");
  $("banner").textContent = ringing.map((a) =>
    a.kind === "timer" ? (a.label && a.label !== "timer" ? `${a.label} timer is done` : "Timer's done")
    : a.kind === "alarm" ? (a.label && a.label !== "alarm" ? a.label : "Alarm")
    : a.kind === "event" ? `Coming up: ${a.label}` : a.label || "Reminder").join(" · ");
}

function place(box, p) { box.style.gridArea = `${p.y + 1} / ${p.x + 1} / span ${p.h} / span ${p.w}`; }
function tint(color) { return !color ? "" : ((live.screen || {}).palette || {})[color] || (/^#[0-9a-f]{6}$/i.test(color) ? color : ""); }

// Lay out a screen: boxes that stay slide to their new place and size, new ones pop in, and the ones
// that go pop out. A box is the same box from one screen to the next if it shows the same thing.
function showScreen(view) {
  const layout = JSON.stringify(view);
  if (layout === live.layout) return false;
  const animate = Boolean(live.layout) && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  live.layout = layout;
  const board = $("board"), face = $("face-box");
  const before = new Map([face, ...board.children].map((box) => [box.dataset.key, box.getBoundingClientRect()]));
  const old = new Map([...board.children].map((box) => [box.dataset.key, box]));
  const seen = new Set();
  const made = view.sections.map((section) => {
    let key = `${section.type}:${section.title || section.list || ""}`;
    while (seen.has(key)) key += "+";
    seen.add(key);
    let box = old.get(key);
    old.delete(key);
    if (!box) { box = document.createElement("section"); box.className = "box"; box.dataset.type = section.type; box.dataset.key = key; }
    place(box, section);
    const color = tint(section.color);
    box.classList.toggle("tinted", Boolean(color));
    if (color) box.style.setProperty("--tint", color); else box.style.removeProperty("--tint");
    box.section = section;
    drawBox(box);
    return box;
  });
  for (const [key, box] of old) {  // the boxes that are going
    const from = before.get(key);
    if (!animate || !from) { box.remove(); continue; }
    Object.assign(box.style, { left: `${from.left}px`, top: `${from.top}px`, width: `${from.width}px`, height: `${from.height}px`, gridArea: "" });
    box.classList.add("leaving");
    document.body.append(box);
    setTimeout(() => box.remove(), 400);
  }
  board.replaceChildren(...made);
  const f = view.face_shown || view.face;
  live.align = view.face.align || "middle";
  place(face, { x: 0, y: 0, ...f });
  document.body.classList.toggle("face-compact", f.w < 5 || f.h < 4);
  document.body.classList.toggle("no-captions", f.w < 5 || f.h < 6);
  document.body.classList.toggle("dim", Boolean(view.dim));
  if (animate) {
    for (const box of [face, ...made]) {
      const from = before.get(box.dataset.key), to = box.getBoundingClientRect();
      if (!from) box.animate([{ opacity: 0, transform: "scale(.82)" }, { opacity: 1, transform: "none" }], { duration: 450, easing: "cubic-bezier(.2, 1.3, .4, 1)" });
      else if (Math.abs(from.left - to.left) + Math.abs(from.top - to.top) + Math.abs(from.width - to.width) + Math.abs(from.height - to.height) > 1) {
        const move = `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width}, ${from.height / to.height})`;
        box.animate([{ transformOrigin: "0 0", transform: move }, { transformOrigin: "0 0", transform: "none" }], { duration: 550, easing: "cubic-bezier(.2, .8, .2, 1)" });
      }
    }
  }
  fitCanvas();
  return true;
}

// Every kind of box there could be, down the right edge, so everyone knows what they can ask for. Faint
// dots most of the time; with names for a little while after the screen changes or when asked.
const RAIL_AWAKE_S = 15;
function showRail(kinds) {
  $("rail").innerHTML = (kinds || []).map((k) => `<div class="pick${k.on ? " on" : ""}"><span class="dot"></span><span class="label">${esc(k.label)}</span></div>`).join("");
}
function wakeRail() {
  $("rail").classList.add("awake");
  clearTimeout(live.railTimer);
  live.railTimer = setTimeout(() => $("rail").classList.remove("awake"), RAIL_AWAKE_S * 1000);
}

async function refresh() {
  try {
    const r = await (await fetch("/api/tv", { cache: "no-store" })).json();
    if (r.now) { data = { ...data, ...r }; skew = Date.now() / 1000 - r.now; }
    else data.weather = r.weather || data.weather;
    loadBoxScripts(r.box_scripts);
    live.weather = data.weather;   // live.weather.wear dresses the face (wearing())
    if (r.state) { live.state = r.state; setDetail(r.state_detail || {}); }
    if (r.layout) {   // the screen's layout (modules/screen, D-111)
      live.screen = r.layout;
      showRail(r.layout.kinds);
      if (showScreen(r.layout.view) && live.shownOnce) wakeRail();
      live.shownOnce = true;
    }
    showBanner(); redraw(); showState();
  } catch { /* the stream reconnects */ }
}
async function refreshVitals() {
  if (!boxes("health").length) return;
  try { data.vitals = await (await fetch("/api/tv/vitals", { cache: "no-store" })).json(); redraw("health"); } catch { /* next time */ }
}

// --- What's happening ----------------------------------------------------------------------------
function remember(line) {
  said.push({ ...line, at: serverNow() });
  if (said.length > KEEP_LINES) said.shift();
  redraw("conversation");
}
// What exactly he's doing (D-112): its words go under the state word, and when he's waiting a known
// time (for you to finish, for a reply) the thin bar under them drains until the wait runs out.
function setDetail(d) {
  live.detail = d.detail || ""; live.words = d.words || "";
  live.endsFrom = performance.now();
  live.endsAt = d.ends_in ? live.endsFrom + d.ends_in * 1000 : 0;
  if (!live.endsAt && d.state !== "speaking") $("level").style.transform = "scaleX(0)";
}
function showCountdown(now) {
  if (!live.endsAt || shown() === "speaking") return;
  const left = clamp((live.endsAt - now) / (live.endsAt - live.endsFrom), 0, 1);
  $("level").style.transform = `scaleX(${left})`;
  if (left === 0) live.endsAt = 0;
}

function handle(kind, d) {
  live.lastEvent = performance.now();
  if (kind === "state") {
    if (d.state !== "idle") live.activeAt = performance.now();
    if (live.state === "listening" && d.state === "thinking") react("perked", .6);
    live.state = d.state;
    setDetail(d);
    showState();
  } else if (kind === "level") {
    live.voiceTarget = d.level; live.voiceAt = performance.now();
    $("level").style.transform = `scaleX(${clamp(d.level * 1.4, 0, 1)})`;
  } else if (kind === "caption") {   // a line said to Pip, or his reply
    live.activeAt = performance.now();
    showCaption(d.who, d.text, d.speaker);
    remember(d);
    if (d.who === "you" && /\b(thanks|thank you|good job|nice one|love you)\b/i.test(d.text)) react("pleased", 3);
  } else if (kind === "line") {      // room talk: only sent while a conversation box shows it (D-111)
    remember(d);
  } else if (kind === "reaction") {   // a module asks for one (the six-seven freak-out); only known faces
    if (d.name === "sixseven") sixSeven();
    else if (FACES[d.name]) react(d.name, 3);
  } else if (kind === "refresh") {
    refresh();
  } else if (kind === "options") {
    wakeRail();
  }
}

function setConnected(connected) {
  if (connected === live.connected) return;
  live.connected = connected;
  if (!connected) { live.voiceTarget = 0; $("level").style.transform = "scaleX(0)"; }
  showState();
}
function connect() {
  live.stream = new EventSource("/api/tv/stream");
  live.stream.onopen = () => {
    if (live.wasLost) return backAgain();
    live.lastEvent = performance.now();
    setConnected(true);
    refresh();
  };
  for (const kind of ["state", "level", "caption", "line", "refresh", "options", "reaction", "ping"])
    live.stream.addEventListener(kind, (m) => handle(kind, JSON.parse(m.data)));
  live.stream.onerror = () => lost();
}
function lost() {
  live.wasLost = true;
  live.stream.close();
  setConnected(false);
  clearTimeout(live.retry);
  live.retry = setTimeout(connect, RECONNECT_S * 1000);
}
// It's back, possibly with new code after an update: load the page afresh, as long as it's really there.
async function backAgain() {
  live.stream.close();
  try {
    if ((await fetch("/tv", { cache: "no-store" })).ok) return location.reload();
  } catch { /* gone again */ }
  live.retry = setTimeout(connect, RECONNECT_S * 1000);
}

function creep() {  // screen care: the whole screen drifts a little, so nothing burns in
  const t = Date.now() / 60000;
  $("screen").style.transform = `translate(${(Math.sin(t / 3.7) * .9).toFixed(2)}rem, ${(Math.sin(t / 2.3) * .7).toFixed(2)}rem)`;
}

showState(); creep();
fitCanvas();
addEventListener("resize", fitCanvas);
new ResizeObserver(() => fitCanvas()).observe(canvas);
setInterval(() => redraw("clock", "timers"), 1000);
setInterval(() => redraw(...Object.keys(MODULE_BOXES), "conversation"), 60000);
setInterval(refreshVitals, VITALS_S * 1000);
setInterval(refresh, 15 * 60000);   // the weather, and anything missed
setInterval(creep, 30000);
setInterval(() => {  // a stream can hang without reporting an error; keep-alives come every 15 s
  if (live.connected && performance.now() - live.lastEvent > SILENCE_S * 1000) lost();
}, 2000);
connect();
requestAnimationFrame(step);
</script>
</body>
</html>
