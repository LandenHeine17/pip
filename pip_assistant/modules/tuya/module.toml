# Smart plugs through Tuya's cloud (D-132): "Pip, turn off the light". A stopgap until Pip hosts a network of
# his own for the plugs and switches them locally (D-36); then this module is replaced or reworked.
# Needs the owner's Tuya developer project in ~/pip-data/secrets.toml:
#   [tuya]   access_id = "..."   access_secret = "..."   region = "us"
# The plugs are the ones paired in the Smart Life app and linked to that project.

name = "tuya"
kind = "device"
summary = "Switches the smart plugs on and off (Eightree, through Tuya's cloud for now)."
says_examples = ["Pip, turn off the light", "is the light on?"]
offline = false                     # through Tuya's cloud: needs the internet (until D-36's local network)
permissions = ["network:openapi.tuyaus.com", "network:openapi-ueaz.tuyaus.com", "network:openapi.tuyaeu.com",
               "network:openapi-weaz.tuyaeu.com", "network:openapi.tuyacn.com", "network:openapi.tuyain.com"]
needs = []

[settings.nicknames]
default = ""
explain = "Other names for the plugs, like: Smart plug = light, lamp; Fan plug = fan. With only one plug, any plug, light or lamp means it anyway."

[settings.refresh_minutes]
default = 10
explain = "How often Pip asks Tuya whether each plug is on. A plug switched in the Smart Life app or by its button shows its old state until then (Pip knows at once about the ones he switches)."

[claude]
instructions = """
Smart plugs: each message lists them with whether they're on. To switch one, reply with ONLY:
ACTION {"do": "plug", "name": "light", "on": false}   ("on": true to turn it on; "name" as they said it).
Several: a JSON list. Pip's code does it and says so. If they ask whether something is on, answer from the list.
"""
