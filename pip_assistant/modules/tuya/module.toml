# The smart plugs (Eightree, Tuya inside; D-132, D-139): "Pip, turn off the light", "turn everything off".
# Each plug on the Wi-Fi network the Pi hosts for them (pip-plugs, deploy/plug-network.sh) is switched directly;
# any other through Tuya's cloud. The cloud also gives the plugs' names and keys, so it's needed at startup.
# Needs the owner's Tuya developer project in ~/pip-data/secrets.toml:
#   [tuya]   access_id = "..."   access_secret = "..."   region = "us"
# The plugs are the ones paired in the Smart Life app and linked to that project.

name = "tuya"
kind = "device"
summary = "Switches the smart plugs on and off (Eightree): directly on Pip's own Wi-Fi network, else through Tuya's cloud."
says_examples = ["Pip, turn off the light", "is the light on?", "Pip, turn everything off"]
offline = true                      # the plugs on Pip's network switch without the internet (once Pip has their keys)
# Tuya's API hosts; and "lan:plugs": talking directly to the plugs inside plug_network below (not through ctx.http)
permissions = ["network:openapi.tuyaus.com", "network:openapi-ueaz.tuyaus.com", "network:openapi.tuyaeu.com",
               "network:openapi-weaz.tuyaeu.com", "network:openapi.tuyacn.com", "network:openapi.tuyain.com",
               "lan:plugs"]
needs = []

[settings.nicknames]
default = ""
explain = "Other names for the plugs, like: Smart plug = light, lamp; Fan plug = fan. With only one plug, any plug, light or lamp means it anyway. \"All\" or \"everything\" means every plug."

[settings.refresh_minutes]
default = 10
explain = "How often Pip asks Tuya's cloud for the list of plugs (their names, and whether those not on Pip's own network are on)."

[settings.check_seconds]
default = 30
explain = "How often Pip asks each plug on his own network whether it's on, so one switched by its button or the Smart Life app shows within this long."

[settings.plug_network]
default = "10.47.0.0/24"
explain = "The addresses of Pip's own Wi-Fi network for the plugs (pip-plugs, made by deploy/plug-network.sh). Only plugs there are talked to directly."

[claude]
instructions = """
Smart plugs: each message lists them with whether they're on. To switch one, reply with ONLY:
ACTION {"do": "plug", "name": "light", "on": false}   ("on": true to turn it on; "name" as they said it).
Every plug at once: "name": "all". Several but not all: a JSON list. Pip's code does it and says so.
If they ask whether something is on, answer from the list.
"""
