<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip · Google settings</title>
<link rel="stylesheet" href="/pip.css">
</head>
<body>
<!-- A Google account's settings moved to its person's profile page (D-148: static/person.js). This address
     (account.html?id=<account id>) still works: it goes there. -->
<main><div class="empty" id="msg">Opening their profile…</div></main>
<script src="/pip.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  let g = null; try { g = await pip.get("status"); } catch (e) {}
  const acc = g && g.accounts.find(a => a.id === id);
  if (acc) location.replace(`/person?id=${encodeURIComponent(acc.person_id)}#google`);
  else $("msg").innerHTML = `That account isn't connected. <a href="/m/google/">Google accounts</a>`;
})();
</script>
</body>
</html>
