<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip · Google settings</title>
<link rel="stylesheet" href="/pip.css">
<style>
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 8px}
td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
td.c{text-align:center}
tr.off td:not(:first-child):not(:nth-child(2)){opacity:.35}
tr.off .cname{text-decoration:line-through;opacity:.6}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0}
.row .what{min-width:15em;font-weight:600}
@media (max-width:640px){th.hide,td.hide{display:none}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><a href="/" class="logo" style="text-decoration:none">P</a>
    <div><h1 id="title">Google settings</h1><div class="sub" id="sub"><a href="/m/google/">← all Google accounts</a></div></div></div>
</header>

<section>
  <div class="head"><h2>This account</h2></div>
  <div class="row"><span class="what">Pip may mention their events and to-dos</span>
    <select id="sharing" onchange="setSharing(this.value)"><option value="everyone">to everyone</option><option value="me">only to them</option></select></div>
  <div style="margin-top:10px"><button class="ghost" onclick="disconnect()">Disconnect this account</button></div>
</section>
<!-- Below: each module that uses Google adds its part (module.toml account_panel = "account.js": the calendar's
     calendars, the to-do lists), drawn by its own script. -->
<div id="panels"></div>
</main>

<script src="/pip.js"></script>
<script>
// A value inside an onclick="…": the browser turns esc()'s &#39; back into ' before the script runs, so a
// name with an apostrophe would end a '…' string early. JSON gives a "…" string instead (written without quotes).
const account = new URLSearchParams(location.search).get("id");
// Each module's part of this page: its static/account.js calls PipAccount.panel(module, draw), and
// draw(el, acc) fills its own element (acc: this Google account; acc.id is its id).
const drawers = {};
window.PipAccount = { panel(module, draw) { drawers[module] = draw; if (acc) draw(slot(module), acc); } };
function slot(module) {
  let el = document.getElementById("panel-" + module);
  if (!el) { el = document.createElement("div"); el.id = "panel-" + module; $("panels").appendChild(el); }
  return el;
}
let acc = null, loaded = false;
async function load(){
  const g = await pip.act(pip.get("status"));
  acc = g && g.accounts.find(a => a.id === account);
  if (!acc) { document.querySelector("main").innerHTML = `<section><div class="empty">That account isn't connected. <a href="/m/google/">Back</a></div></section>`; return; }
  $("title").textContent = `Google settings · ${acc.person}`;
  $("sub").innerHTML = `${esc(acc.email)} · <a href="/m/google/">all Google accounts</a>`;
  $("sharing").value = acc.sharing;
  if (!loaded) {   // the modules' scripts, once (each calls PipAccount.panel when it has loaded)
    loaded = true;
    const mods = await getJSON("/api/modules").catch(() => []);
    for (const m of mods.filter(m => m.account)) {
      slot(m.name);
      const tag = document.createElement("script"); tag.src = m.account; document.body.appendChild(tag);
    }
  }
  for (const [module, draw] of Object.entries(drawers)) draw(slot(module), acc);
}
async function setSharing(value){ const r = await pip.act(pip.post("sharing", {id: account, value})); if (r) load(); }
async function disconnect(){ if (confirm(`Disconnect ${acc.email}? Pip forgets its calendar and to-dos here (nothing is deleted in Google).`)) {
  const r = await pip.act(pip.post("disconnect", {id: account})); if (r) location.href = "/m/google/"; } }
load();
</script>
</body>
</html>
