# The household calendar (D-98, D-99, D-101): Pip's own events, plus each connected person's
# Google calendars, synced both ways. A month view on the dashboard.

name = "calendar"
kind = "skill"
summary = "The calendar: events by voice or on the dashboard, synced both ways with Google Calendar."
says_examples = ["Pip, put the dentist on Friday at 3", "what have I got tomorrow?", "move my 3 o'clock to 4",
                 "dinner with Sam Saturday at 7, make it private"]
offline = true                      # Pip's own calendar works offline; Google catches up when he's back
permissions = ["network:googleapis.com"]
needs = ["google"]

[settings.sync_minutes]
default = 2.0
explain = "How often Pip checks Google for calendar changes (his own changes are sent straight away)."

[settings.household_calendar]
default = ""
explain = "Where events go when Pip doesn't know whose they are: the email of a connected Google account (its main calendar), or empty for the first admin's (or Pip's own calendar if nobody is connected). A calendar picked as the household's on an account's Google settings page comes first."

[settings.days_back]
default = 30
explain = "How far back Pip keeps a copy of Google events."

[settings.days_ahead]
default = 180
explain = "How far ahead Pip keeps a copy of Google events."

[settings.upload_on_connect]
default = true
explain = "When the household's Google account is first connected, copy Pip's own upcoming events into it."

[claude]
instructions = """
Calendar: each message shows only today and tomorrow (ids like #e1a2b3), how many events each later day this \
week has, and the calendars' names. Anything else, or the details of later days, look up first with
ACTION {"do": "look", "kind": "calendar", "from": "2026-11-13", "to": "2026-11-13"} (at most a month; optional \
"calendar": a calendar's name). Pip then asks you again with what's there; answer from that (don't look twice).
Events, with ACTION lines (Pip's code does it and confirms):
- add: {"do": "add", "kind": "event", "title": "dentist", "at": "2026-11-13T15:00"} or with "date" and \
"all_day": true. Optional: "end" (local time), "location", "repeat" (as for alarms), "heads_up_minutes", \
"private": true (when they say make it or keep it private: Pip will never mention it), "calendar": which one, \
by its name from the list ("Work", "Landen: Work") or a person ("Sam" = Sam's main); otherwise the speaker's \
main calendar, or the household's.
- change: {"do": "change", "id": "#e1a2b3", "at": "..."} (or "shift_seconds"; optional "end", "title", \
"location", "calendar" to move it to another calendar). To change an event you can't see yet, look it up first.
- cancel: {"do": "cancel", "id": "#e1a2b3"}.
Whole calendars (by name from the list):
- make one: {"do": "add", "kind": "calendar", "name": "Gym", "color": "green"} (optional "whose": a person)
- change: {"do": "change", "kind": "calendar", "calendar": "Gym", "name": "Fitness"} or "color" (red, orange, \
yellow, green, teal, blue, purple, pink, grey, brown), "shown": false/true (hide or show it on the calendar \
page and in what you're told), "ignored": true (Pip forgets it completely; only the dashboard brings it back).
- delete: first ask out loud "Delete the Gym calendar and everything on it?"; only after a clear yes, send \
{"do": "cancel", "kind": "calendar", "calendar": "Gym", "confirmed": true}. Main calendars can't be deleted; \
one shared with them is only taken off their list.
"""

[dashboard]
page = "index.html"
label = "Calendar"
